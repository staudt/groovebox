<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound screen: FM editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316}
a{color:#ECEDEF;text-decoration:none}a:hover{color:#FFFFFF}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121316; color: #ECEDEF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 16px 0 16px; gap: 10px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 8px; height: 44px">
<span style="font-size: 16px; font-weight: 700; flex-grow: 1; min-width: 0">[Project name]</span>
<button style="height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #2E313A; background: #1E2026; color: #ECEDEF; font-family: 'IBM Plex Mono', monospace; font-size: 13px">92 BPM</button>
<button aria-label="Record" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2E313A; background: #1E2026; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="#FF6B5E"></circle></svg>
</button>
<button aria-label="Play" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3 L15 9 L5 15 Z" fill="#121316"></path></svg>
</button>
</div>

<div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="6">
<button onClick="{{t.pick}}" style="{{t.style}}">
<span style="font-size: 13px; font-weight: 700">{{t.name}}</span>
<span style="font-size: 10px; font-family: 'IBM Plex Mono', monospace; opacity: 0.8">{{t.kind}}</span>
</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 8px; height: 36px; margin-top: 2px">
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 700">[Patch name]</span>
<span style="font-size: 11px; color: #9A9DA6; font-family: 'IBM Plex Mono', monospace">{{selName}} · {{engine}}</span>
</div>
<button style="height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid #2E313A; background: #1E2026; color: #ECEDEF; font-size: 12px">Random</button>
<button style="height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid #2E313A; background: #1E2026; color: #ECEDEF; font-size: 12px">Save</button>
</div>

<div style="background: #1A1C21; border: 1px solid #262930; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 13px; font-weight: 700; flex-grow: 1">Algorithm</span>
<button aria-label="Previous algorithm" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #2E313A; background: transparent; color: #C9CBD1">‹</button>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #C9CBD1">05 / 32</span>
<button aria-label="Next algorithm" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #2E313A; background: transparent; color: #C9CBD1">›</button>
</div>
<div style="position: relative; width: 332px; height: 140px; margin: 0 auto">
<svg width="332" height="140" viewBox="0 0 332 140" style="position: absolute; left: 0; top: 0" aria-hidden="true" fill="none" stroke="#3A3E48" stroke-width="2">
<path d="M55 56 V80 M166 56 V80 M277 56 V80"></path>
<path d="M55 132 V138 H277 V132 M166 132 V138"></path>
<path d="M311 18 h10 v-12 h-44 v4" stroke="#5A5F6B"></path>
</svg>
<sc-for list="{{ops}}" as="o" hint-placeholder-count="6">
<button onClick="{{o.pick}}" style="{{o.style}}">
<span style="font-size: 11px; font-family: 'IBM Plex Mono', monospace; opacity: 0.85">OP{{o.n}}</span>
<span style="font-size: 15px; font-weight: 700">×{{o.ratio}}</span>
</button>
</sc-for>
</div>
</div>

<div style="background: #1A1C21; border: 1px solid #262930; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-size: 15px; font-weight: 700">OP{{selN}}</span>
<span style="font-size: 12px; color: #9A9DA6; flex-grow: 1">{{selRole}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #C9CBD1">ratio {{selRatio}} · lvl {{selLevel}}</span>
</div>
<svg width="334" height="70" viewBox="0 0 334 70" role="img" aria-label="Envelope: drag the points to shape attack, decay, sustain and release">
<path d="M0 69.5 H334" stroke="#2A2D34"></path>
<path d="{{envFill}}" fill="{{accentSoft}}"></path>
<path d="{{envLine}}" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linejoin="round"></path>
<sc-for list="{{envPts}}" as="p" hint-placeholder-count="4">
<circle cx="{{p.x}}" cy="{{p.y}}" r="7" fill="#121316" stroke="{{accent}}" stroke-width="2.5"></circle>
</sc-for>
</svg>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9A9DA6; text-align: center">
<span>ATK</span><span>DEC</span><span>SUS</span><span>REL</span>
</div>
</div>

<div style="display: flex; gap: 8px; align-items: center; background: #172129; border: 1px solid #2B4A5C; border-radius: 16px; padding: 10px 10px 10px 12px">
<svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="#5CC8FF" stroke-width="1.6" stroke-linecap="round"><path d="M9 2 L10.6 7.4 L16 9 L10.6 10.6 L9 16 L7.4 10.6 L2 9 L7.4 7.4 Z"></path></svg>
<input aria-label="Describe a sound" placeholder="Describe a sound: glassy bell, slow attack…" style="flex-grow: 1; min-width: 0; height: 44px; border: none; background: transparent; color: #ECEDEF; font-size: 14px">
<button style="height: 44px; padding: 0 14px; border-radius: 12px; border: none; background: #5CC8FF; color: #0E1A22; font-weight: 700; font-size: 14px">Make</button>
</div>

<div style="margin-top: auto; margin-left: -16px; margin-right: -16px; background: #16171B; border-top: 1px solid #23262D; padding: 8px 16px 10px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px">
<button onClick="{{kb.toggle}}" style="height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid #2E313A; background: #1E2026; color: #ECEDEF; font-size: 12px; display: flex; align-items: center; gap: 6px; flex-grow: 1">
<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="{{kb.chevron}}"></path></svg>Keys</button>
<button onClick="{{kb.setScale}}" style="{{kb.scaleStyle}}">Scale</button>
<button onClick="{{kb.setPiano}}" style="{{kb.pianoStyle}}">Piano</button>
<button onClick="{{kb.down}}" aria-label="Octave down" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #2E313A; background: #1E2026; color: #ECEDEF">−</button>
<span style="width: 24px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px">C{{kb.oct}}</span>
<button onClick="{{kb.up}}" aria-label="Octave up" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #2E313A; background: #1E2026; color: #ECEDEF">+</button>
<button onClick="{{kb.hold}}" style="{{kb.holdStyle}}">Hold</button>
</div>
<sc-if value="{{kb.showScale}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{kb.scaleKeys}}" as="k" hint-placeholder-count="8">
<button onClick="{{k.press}}" style="{{k.style}}">{{k.label}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{kb.showPiano}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; height: 64px">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; height: 64px">
<sc-for list="{{kb.whites}}" as="k" hint-placeholder-count="7">
<button onClick="{{k.press}}" style="{{k.style}}">{{k.label}}</button>
</sc-for>
</div>
<sc-for list="{{kb.blacks}}" as="k" hint-placeholder-count="5">
<button onClick="{{k.press}}" aria-label="{{k.label}}" style="{{k.style}}"></button>
</sc-for>
</div>
</sc-if>
</div>
<nav style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 68px; border-top: 1px solid #23262D; margin-left: -16px; margin-right: -16px; background: #16171B">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #9A9DA6">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="7" height="7" rx="1.5"></rect><rect x="11" y="2" width="7" height="7" rx="1.5"></rect><rect x="2" y="11" width="7" height="7" rx="1.5"></rect><rect x="11" y="11" width="7" height="7" rx="1.5"></rect></svg>Play</a>
<a href="Sound.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: {{accent}}">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 10 C4 2 6 2 8 10 S12 18 14 10 S17 4 19 10"></path></svg>Sound</a>
<a href="FX.dc.html" style="display: flex; align-items: center; justify-content: center"><span style="width: 54px; height: 42px; border-radius: 14px; background: #FF6B5E; color: #121316; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">FX</span></a>
<a href="Perform.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #9A9DA6">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="16" height="16" rx="2"></rect><circle cx="12" cy="8" r="2.5"></circle></svg>Perform</a>
<a href="Song.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #9A9DA6">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 5 h6 M10 5 h8 M2 10 h10 M14 10 h4 M2 15 h4 M8 15 h10"></path></svg>Song</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5CC8FF","#B8F07A","#FF8FB1"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { track: 4, sel: 1, take: 0, kbOpen: true, kbMode: 'piano', oct: 3, hold: true, litKey: 'w4' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#FFB547';
    const trackDefs = [
      ['KICK','drum'],['SNARE','drum'],['HATS','drum'],['BASS','FM'],
      ['KEYS','FM'],['PAD','FM'],['PERC','sample'],['VOX','sample']
    ];
    const tracks = trackDefs.map((d, i) => {
      const on = i === this.state.track;
      return {
        name: d[0], kind: d[1],
        pick: () => this.setState({ track: i }),
        style: 'flex-shrink: 0; min-width: 56px; height: 48px; padding: 0 9px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1px; cursor: pointer; ' +
          (on ? 'background: ' + accent + '; color: #121316; border: 1px solid ' + accent + ';' : 'background: #1E2026; color: #ECEDEF; border: 1px solid #2E313A;')
      };
    });
    const engines = { drum: 'drum synth', FM: 'FM 6-op', sample: 'sampler' };
    const defs = [
      { n: 2, ratio: '3.50', level: 72, role: 'modulator → OP1', x: 19, y: 4, env: [0.05, 0.25, 0.3, 0.3] },
      { n: 4, ratio: '1.00', level: 58, role: 'modulator → OP3', x: 130, y: 4, env: [0.02, 0.4, 0.5, 0.2] },
      { n: 6, ratio: '7.00', level: 40, role: 'modulator → OP5, feedback', x: 241, y: 4, env: [0.01, 0.1, 0.0, 0.1] },
      { n: 1, ratio: '1.00', level: 90, role: 'carrier, heard', x: 19, y: 80, env: [0.3, 0.3, 0.7, 0.5] },
      { n: 3, ratio: '2.01', level: 66, role: 'carrier, heard', x: 130, y: 80, env: [0.35, 0.3, 0.6, 0.5] },
      { n: 5, ratio: '0.50', level: 74, role: 'carrier, heard', x: 241, y: 80, env: [0.2, 0.5, 0.8, 0.4] }
    ];
    const ops = defs.map((d, i) => {
      const on = i === this.state.sel;
      return {
        n: d.n, ratio: d.ratio,
        pick: () => this.setState({ sel: i }),
        style: 'position: absolute; left: ' + d.x + 'px; top: ' + d.y + 'px; width: 72px; height: 52px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; ' +
          (on ? 'background: ' + accent + '; color: #121316; border: 1px solid ' + accent + ';' : 'background: #24272E; color: #ECEDEF; border: 1px solid #343843;')
      };
    });
    const d = defs[this.state.sel];
    const W = 334, H = 70, pad = 8;
    const a = d.env[0], dc = d.env[1], s = d.env[2], r = d.env[3];
    const seg = (W - pad * 2) / 4;
    const x1 = pad + a * seg * 1.4;
    const x2 = x1 + 20 + dc * seg * 1.2;
    const x3 = W - pad - (20 + r * seg * 1.2);
    const x4 = W - pad;
    const yTop = pad, yBot = H - 2, yS = yTop + (1 - s) * (yBot - yTop);
    const pts = [[pad, yBot], [x1, yTop], [x2, yS], [x3, yS], [x4, yBot]];
    const line = 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
    const envPts = pts.slice(1, 5).map((p) => ({ x: p[0].toFixed(1), y: p[1].toFixed(1) }));
    const takes = ['A', 'B', 'C'].map((l, i) => {
      const on = i === this.state.take;
      return {
        label: l,
        pick: () => this.setState({ take: i }),
        style: 'width: 44px; height: 44px; border-radius: 12px; font-weight: 700; cursor: pointer; ' +
          (on ? 'background: #5CC8FF; color: #0E1A22; border: 1px solid #5CC8FF;' : 'background: transparent; color: #9FD9F7; border: 1px solid #2B4A5C;')
      };
    });

    const kbOpen = this.state.kbOpen, kbMode = this.state.kbMode;
    const pill = (on) => 'height: 36px; padding: 0 9px; border-radius: 10px; font-size: 12px; cursor: pointer; ' + (on ? 'background: #ECEDEF; color: #121316; border: 1px solid #ECEDEF;' : 'background: transparent; color: #C9CBD1; border: 1px solid #343843;');
    const press = (id) => () => this.setState({ litKey: id });
    const scaleNames = ['C','D','E♭','F','G','A♭','B♭','C'];
    const scaleKeys = scaleNames.map((n, i) => {
      const on = this.state.litKey === 's' + i;
      return { label: n, press: press('s' + i), style: 'height: 64px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; ' +
        (on ? 'background: ' + accent + '; color: #121316; border: 1px solid ' + accent + ';' : 'background: ' + ((i === 0 || i === 7) ? '#2C3038' : '#22252B') + '; color: #ECEDEF; border: 1px solid #343843;') };
    });
    const wNames = ['C','D','E','F','G','A','B'], wIn = [1,1,0,1,1,0,0];
    const whites = wNames.map((n, i) => {
      const on = this.state.litKey === 'w' + i;
      return { label: n, press: press('w' + i), style: 'height: 64px; border-radius: 0 0 8px 8px; border: none; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; font-size: 11px; font-weight: 700; cursor: pointer; color: #121316; background: ' +
        (on ? accent : (wIn[i] ? '#E6E7EA' : '#A9ACB4')) + ';' };
    });
    const bAt = [0,1,3,4,5], bNames = ['C♯','E♭','F♯','A♭','B♭'], bIn = [0,1,0,1,1];
    const blacks = bAt.map((w, i) => {
      const on = this.state.litKey === 'b' + i;
      return { label: bNames[i], press: press('b' + i), style: 'position: absolute; top: 0; height: 38px; width: 9%; left: calc(' + (((w + 1) / 7) * 100).toFixed(2) + '% - 4.5%); border-radius: 0 0 6px 6px; border: 1px solid #121316; cursor: pointer; background: ' +
        (on ? accent : (bIn[i] ? '#4A4F5C' : '#16171B')) + ';' };
    });
    const kb = {
      oct: this.state.oct,
      chevron: kbOpen ? 'M2 4 L6 8 L10 4' : 'M2 8 L6 4 L10 8',
      toggle: () => this.setState({ kbOpen: !kbOpen }),
      setScale: () => this.setState({ kbMode: 'scale', kbOpen: true }),
      setPiano: () => this.setState({ kbMode: 'piano', kbOpen: true }),
      scaleStyle: pill(kbMode === 'scale'), pianoStyle: pill(kbMode === 'piano'),
      down: () => this.setState({ oct: Math.max(1, this.state.oct - 1) }),
      up: () => this.setState({ oct: Math.min(7, this.state.oct + 1) }),
      hold: () => this.setState({ hold: !this.state.hold }),
      holdStyle: 'height: 36px; padding: 0 9px; border-radius: 10px; font-size: 12px; cursor: pointer; ' + (this.state.hold ? 'background: ' + accent + '; color: #121316; border: 1px solid ' + accent + ';' : 'background: transparent; color: #C9CBD1; border: 1px solid #343843;'),
      showScale: kbOpen && kbMode === 'scale', showPiano: kbOpen && kbMode === 'piano',
      scaleKeys, whites, blacks
    };
    const t = trackDefs[this.state.track];
    return {
      accent, accentSoft: accent + '22', tracks, kb,
      selName: t[0], engine: engines[t[1]],
      ops, selN: d.n, selRole: d.role, selRatio: d.ratio, selLevel: d.level,
      envLine: line, envFill: line + ' Z', envPts, takes
    };
  }
}
</script>
</body>
</html>
