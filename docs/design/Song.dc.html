<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Song screen: sections and AI jam queue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316}
a{color:#ECEDEF;text-decoration:none}a:hover{color:#FFFFFF}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121316; color: #ECEDEF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 16px 0 16px; gap: 12px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 8px; height: 44px">
<span style="font-size: 16px; font-weight: 700; flex-grow: 1; min-width: 0">[Project name]</span>
<button style="height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #2E313A; background: #1E2026; color: #ECEDEF; font-family: 'IBM Plex Mono', monospace; font-size: 13px">92 BPM</button>
<button aria-label="Record" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2E313A; background: #1E2026; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="#FF6B5E"></circle></svg>
</button>
<button aria-label="Play" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3 L15 9 L5 15 Z" fill="#121316"></path></svg>
</button>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 15px; font-weight: 700; flex-grow: 1">Arrangement · all tracks</span>
<button onClick="{{toggleJam}}" style="{{jamStyle}}">
<svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 2 L10.6 7.4 L16 9 L10.6 10.6 L9 16 L7.4 10.6 L2 9 L7.4 7.4 Z"></path></svg>
Jam mode {{jamLabel}}
</button>
</div>

<div style="display: flex; gap: 6px">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="5">
<button style="{{s.style}}">
<span style="font-size: 15px; font-weight: 700">{{s.name}}</span>
<span style="font-size: 10px; font-family: 'IBM Plex Mono', monospace; opacity: 0.8">{{s.bars}} bars</span>
<span style="{{s.progress}}"></span>
</button>
</sc-for>
</div>

<div style="background: #1A1C21; border: 1px solid #262930; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px">
<sc-for list="{{lanes}}" as="l" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 6px">
<span style="width: 44px; font-size: 10px; font-family: 'IBM Plex Mono', monospace; color: #9A9DA6">{{l.name}}</span>
<sc-for list="{{l.cells}}" as="c" hint-placeholder-count="5">
<span style="{{c.style}}"></span>
</sc-for>
</div>
</sc-for>
</div>

<div style="background: #172129; border: 1px solid #2B4A5C; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: #9FD9F7; flex-grow: 1">Up next, prepared while you play</span>
<span style="font-size: 11px; color: #9FD9F7; font-family: 'IBM Plex Mono', monospace">bar 3 of 8</span>
</div>
<sc-for list="{{ideas}}" as="i" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 8px; min-height: 48px">
<div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
<span style="font-size: 13px; color: #ECEDEF">{{i.text}}</span>
<span style="font-size: 11px; color: #9FD9F7">{{i.status}}</span>
</div>
<button onClick="{{i.skip}}" style="height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #2B4A5C; background: transparent; color: #9FD9F7; font-size: 12px">Skip</button>
<button onClick="{{i.queue}}" style="{{i.queueStyle}}">{{i.queueLabel}}</button>
</div>
</sc-for>
</div>

<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #2B4A5C; background: #172129; color: #9FD9F7; text-align: left; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="#5CC8FF" stroke-width="1.6" stroke-linecap="round"><path d="M9 2 L10.6 7.4 L16 9 L10.6 10.6 L9 16 L7.4 10.6 L2 9 L7.4 7.4 Z"></path></svg>
Ask: build to a drop in 8 bars…
</button>

<nav style="margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 68px; border-top: 1px solid #23262D; margin-left: -16px; margin-right: -16px; background: #16171B">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #9A9DA6">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="7" height="7" rx="1.5"></rect><rect x="11" y="2" width="7" height="7" rx="1.5"></rect><rect x="2" y="11" width="7" height="7" rx="1.5"></rect><rect x="11" y="11" width="7" height="7" rx="1.5"></rect></svg>Play</a>
<a href="Sound.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #9A9DA6">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 10 C4 2 6 2 8 10 S12 18 14 10 S17 4 19 10"></path></svg>Sound</a>
<a href="FX.dc.html" style="display: flex; align-items: center; justify-content: center"><span style="width: 54px; height: 42px; border-radius: 14px; background: #FF6B5E; color: #121316; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">FX</span></a>
<a href="Perform.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #9A9DA6">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="16" height="16" rx="2"></rect><circle cx="12" cy="8" r="2.5"></circle></svg>Perform</a>
<a href="Song.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: {{accent}}">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 5 h6 M10 5 h8 M2 10 h10 M14 10 h4 M2 15 h4 M8 15 h10"></path></svg>Song</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5CC8FF","#B8F07A","#FF8FB1"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { jam: true, queued: [true, false, false], skipped: [false, false, false] };
  }
  renderVals() {
    const accent = this.props.accent ?? '#FFB547';
    const secDefs = [['Intro', 4, 1], ['A', 8, 0.35], ['A2', 8, 0], ['Fill', 1, 0], ['B', 8, 0]];
    const sections = secDefs.map((s, i) => {
      const playing = i === 1;
      const done = s[2] === 1;
      return {
        name: s[0], bars: s[1],
        style: 'flex: ' + (s[1] === 1 ? '0.6' : '1') + ' 1 0; min-width: 0; height: 64px; border-radius: 12px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; position: relative; overflow: hidden; cursor: pointer; ' +
          (playing ? 'background: #2A2418; border: 2px solid ' + accent + '; color: #ECEDEF;' : 'background: #1E2026; border: 1px solid #2E313A; color: ' + (done ? '#9A9DA6' : '#ECEDEF') + ';'),
        progress: 'position: absolute; left: 0; bottom: 0; height: 4px; width: ' + Math.round(s[2] * 100) + '%; background: ' + accent + ';'
      };
    });
    const laneDefs = [
      ['KICK', [1,1,1,1,1]], ['SNARE', [0,1,1,1,1]], ['HATS', [1,1,2,1,1]], ['BASS', [0,1,1,0,2]],
      ['KEYS', [1,1,1,0,3]], ['PAD', [1,0,0,0,1]], ['PERC', [0,0,1,1,1]], ['VOX', [0,0,0,1,1]]
    ];
    const lanes = laneDefs.map((l) => ({
      name: l[0],
      cells: l[1].map((v, i) => ({
        style: 'flex: ' + (i === 3 ? '0.6' : '1') + ' 1 0; height: 14px; border-radius: 4px; box-sizing: border-box; ' +
          (v === 2 ? 'background: transparent; border: 1.5px dashed #5CC8FF;' : (v === 3 ? 'background: #5CC8FF;' : (v === 1 ? 'background: ' + (i === 1 ? accent : '#3A3E48') + ';' : 'background: #202228;')))
      }))
    }));
    const ideaDefs = [
      'A2: hats go double-time in the last bar',
      'Fill: snare roll with a filter rise into B',
      'B: bass follows your hummed hook'
    ];
    const ideas = ideaDefs.map((t, i) => {
      const q = this.state.queued[i];
      const sk = this.state.skipped[i];
      return {
        text: t,
        status: sk ? 'Skipped, will try another' : (q ? 'Queued, plays at the next section' : 'Ready, hold to preview'),
        queueLabel: q ? 'Queued' : 'Queue',
        queue: () => { const a = this.state.queued.slice(); a[i] = !a[i]; const b = this.state.skipped.slice(); b[i] = false; this.setState({ queued: a, skipped: b }); },
        skip: () => { const b = this.state.skipped.slice(); b[i] = true; const a = this.state.queued.slice(); a[i] = false; this.setState({ skipped: b, queued: a }); },
        queueStyle: 'height: 40px; padding: 0 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; ' +
          (q ? 'background: #5CC8FF; color: #0E1A22; border: 1px solid #5CC8FF;' : 'background: #1F3442; color: #CFEBFA; border: 1px solid #2B4A5C;')
      };
    });
    return {
      accent, sections, lanes, ideas,
      jamLabel: this.state.jam ? 'on' : 'off',
      toggleJam: () => this.setState({ jam: !this.state.jam }),
      jamStyle: 'display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 13px; cursor: pointer; ' +
        (this.state.jam ? 'background: #1F3442; color: #9FD9F7; border: 1px solid #5CC8FF;' : 'background: #1E2026; color: #C9CBD1; border: 1px solid #2E313A;')
    };
  }
}
</script>
</body>
</html>
