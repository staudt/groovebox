<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture: listening</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316}
a{color:#ECEDEF;text-decoration:none}a:hover{color:#FFFFFF}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121316; color: #ECEDEF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px; gap: 14px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 8px; height: 44px">
<a href="Perform.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2E313A; background: #1E2026; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#ECEDEF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13"></path></svg>
</a>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span style="font-size: 17px; font-weight: 700">Capture a melody</span>
<span style="font-size: 11px; color: #9A9DA6; font-family: 'IBM Plex Mono', monospace">into KEYS · any key, fixed after</span>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="4">
<button onClick="{{s.pick}}" style="{{s.style}}">
<span style="font-size: 13px; font-weight: 700">{{s.label}}</span>
<span style="font-size: 10px; opacity: 0.8">{{s.sub}}</span>
</button>
</sc-for>
</div>
<span style="font-size: 12px; color: #9FD9F7; margin-top: -6px">{{tip}}</span>

<div style="background: #1A1C21; border: 1px solid #262930; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 56px; font-weight: 700; line-height: 1">E4</span>
<span style="font-size: 18px; font-family: 'IBM Plex Mono', monospace; color: {{accent}}">+12¢</span>
</div>
<div style="position: relative; width: 100%; height: 18px" role="img" aria-label="Tuning: 12 cents sharp">
<div style="position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: #2E313A"></div>
<div style="position: absolute; left: 25%; top: 4px; width: 2px; height: 10px; background: #3A3E48"></div>
<div style="position: absolute; left: 50%; top: 0; width: 2px; height: 18px; background: #9A9DA6"></div>
<div style="position: absolute; left: 75%; top: 4px; width: 2px; height: 10px; background: #3A3E48"></div>
<div style="position: absolute; left: 62%; top: 1px; width: 16px; height: 16px; margin-left: -8px; border-radius: 8px; background: {{accent}}"></div>
</div>
<span style="font-size: 12px; color: #9A9DA6">Sing in any key. Only the shape matters; you fit it to the song next.</span>
</div>

<div style="position: relative; height: 270px; border-radius: 16px; background: #1A1C21; border: 1px solid #262930; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<div style="{{r.style}}"><span style="width: 34px; padding-left: 8px; font-size: 10px; font-family: 'IBM Plex Mono', monospace; color: #9A9DA6">{{r.name}}</span></div>
</sc-for>
<svg width="358" height="270" viewBox="0 0 358 270" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="M40 0 V270 M199 0 V270" stroke="#2E313A"></path>
<path d="{{trace}}" fill="none" stroke="#5CC8FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M{{headX}} 0 V270" stroke="{{accent}}" stroke-width="2"></path>
</svg>
<span style="position: absolute; left: 44px; top: 6px; font-size: 10px; font-family: 'IBM Plex Mono', monospace; color: #9A9DA6">BAR 1</span>
<span style="position: absolute; left: 203px; top: 6px; font-size: 10px; font-family: 'IBM Plex Mono', monospace; color: #9A9DA6">BAR 2</span>
</div>

<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 10px; height: 10px; border-radius: 5px; background: #FF6B5E"></span>
<span style="font-size: 13px; flex-grow: 1">Recording bar 2 of 2, loop playing</span>
<div style="display: flex; gap: 3px; align-items: flex-end; height: 20px" aria-hidden="true">
<span style="width: 4px; height: 6px; background: #5CC8FF; border-radius: 2px"></span>
<span style="width: 4px; height: 10px; background: #5CC8FF; border-radius: 2px"></span>
<span style="width: 4px; height: 15px; background: #5CC8FF; border-radius: 2px"></span>
<span style="width: 4px; height: 12px; background: #5CC8FF; border-radius: 2px"></span>
<span style="width: 4px; height: 18px; background: #3A3E48; border-radius: 2px"></span>
</div>
</div>

<div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #2E313A; background: #1E2026; color: #ECEDEF; font-size: 13px">Count-in: 1 bar</button>
<a href="HumPlace.dc.html" aria-label="Stop and review" style="width: 76px; height: 76px; border-radius: 38px; background: #FF6B5E; display: flex; align-items: center; justify-content: center">
<span style="width: 26px; height: 26px; border-radius: 6px; background: #121316"></span>
</a>
<button style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #2E313A; background: #1E2026; color: #ECEDEF; font-size: 13px">Length: 2 bars</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5CC8FF","#B8F07A","#FF8FB1"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { src: 0 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#FFB547';
    const srcDefs = [
      ['Voice', 'sing “da”', 'Sing “da” or “doo” rather than “mmm”: the consonants mark where notes start.'],
      ['Whistle', 'cleanest', 'Whistling is the cleanest signal for pitch. It lands an octave or two high; that is fixed after.'],
      ['Guitar', 'single notes', 'Pick single notes. Each pluck is a clear note start, so rhythm comes out tight.'],
      ['Chords', 'strum, ML', 'Strum or play chords. A small on-device model picks out several notes at once.']
    ];
    const sources = srcDefs.map((s, i) => {
      const on = i === this.state.src;
      return {
        label: s[0], sub: s[1],
        pick: () => this.setState({ src: i }),
        style: 'height: 52px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; ' +
          (on ? 'background: ' + accent + '; color: #121316; border: 1px solid ' + accent + ';' : 'background: #1E2026; color: #ECEDEF; border: 1px solid #2E313A;')
      };
    });
    const names = ['B4','A4','G4','F♯4','E4','D4','C4','B3','A3','G3','F♯3','E3'];
    const H = 270, rowH = H / names.length;
    const rows = names.map((n, i) => ({
      name: n,
      style: 'position: absolute; left: 0; right: 0; top: ' + (i * rowH).toFixed(1) + 'px; height: ' + rowH.toFixed(1) + 'px; display: flex; align-items: center; box-sizing: border-box; border-bottom: 1px solid #22252B;'
    }));
    const x0 = 40, stepW = 318 / 16;
    const melody = [[0,2,4],[2,1,5],[3,1,4],[4,2,3],[6,2,2],[8,1,3],[9,3,4]];
    const yOf = (row) => H - (row + 0.5) * rowH - 40;
    const pts = [];
    melody.forEach((m, idx) => {
      const start = x0 + m[0] * stepW - 6;
      const end = x0 + (m[0] + m[1]) * stepW - 6;
      const y = yOf(m[2] + 2);
      for (let x = start; x <= end; x += 4) pts.push([x, y + Math.sin((x + idx * 7) / 5) * 2.2]);
    });
    const trace = 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
    return { accent, sources, tip: srcDefs[this.state.src][2], rows, trace, headX: (x0 + 12 * stepW - 6).toFixed(1) };
  }
}
</script>
</body>
</html>
