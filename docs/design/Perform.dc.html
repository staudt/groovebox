<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Perform screen: pads, XY and punch-in FX</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316}
a{color:#ECEDEF;text-decoration:none}a:hover{color:#FFFFFF}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121316; color: #ECEDEF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 16px 0 16px; gap: 10px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 8px; height: 44px">
<span style="font-size: 16px; font-weight: 700; flex-grow: 1; min-width: 0">[Project name]</span>
<button style="height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #2E313A; background: #1E2026; color: #ECEDEF; font-family: 'IBM Plex Mono', monospace; font-size: 13px">92 BPM</button>
<button aria-label="Record" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2E313A; background: #1E2026; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="#FF6B5E"></circle></svg>
</button>
<button aria-label="Play" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3 L15 9 L5 15 Z" fill="#121316"></path></svg>
</button>
</div>

<div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="6">
<button onClick="{{t.pick}}" style="{{t.style}}">
<span style="font-size: 13px; font-weight: 700">{{t.name}}</span>
<span style="font-size: 10px; font-family: 'IBM Plex Mono', monospace; opacity: 0.8">{{t.kind}}</span>
</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 8px; margin-top: 2px">
<button style="height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #2E313A; background: #1E2026; color: #ECEDEF; font-size: 12px">Key: C minor</button>
<button onClick="{{toggleChords}}" style="{{chordBtnStyle}}">Chords</button>
<span style="flex-grow: 1"></span>
<a href="Hum.dc.html" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #2B4A5C; background: #172129; color: #9FD9F7; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="9" rx="2.5"></rect><path d="M3 8 a5 5 0 0 0 10 0 M8 13 v2"></path></svg>Capture</a>
</div>

<div style="position: relative; height: 160px; border-radius: 16px; background: #1A1C21; border: 1px solid #262930; overflow: hidden">
<svg width="358" height="160" viewBox="0 0 358 160" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="M89.5 0 V160 M179 0 V160 M268.5 0 V160 M0 40 H358 M0 80 H358 M0 120 H358" stroke="#23262D"></path>
<path d="M0 58 H358 M236 0 V160" stroke="{{accent}}" stroke-opacity="0.35"></path>
<circle cx="236" cy="58" r="22" fill="{{accent}}" fill-opacity="0.18"></circle>
<circle cx="236" cy="58" r="10" fill="{{accent}}"></circle>
</svg>
<span style="position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #9A9DA6; font-family: 'IBM Plex Mono', monospace">X  FM AMOUNT</span>
<span style="position: absolute; left: 12px; top: 10px; font-size: 11px; color: #9A9DA6; font-family: 'IBM Plex Mono', monospace">Y  SPACE</span>
<span style="position: absolute; right: 12px; top: 10px; font-size: 11px; color: #9A9DA6">tilt phone = Y</span>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{fx}}" as="f" hint-placeholder-count="4">
<button onClick="{{f.hold}}" style="{{f.style}}">
<span style="font-size: 13px; font-weight: 700">{{f.label}}</span>
<span style="font-size: 10px; opacity: 0.75">hold</span>
</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{pads}}" as="p" hint-placeholder-count="16">
<button onClick="{{p.hit}}" style="{{p.style}}">
<span style="font-size: 16px; font-weight: 700">{{p.label}}</span>
<sc-if value="{{p.next}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 10px; color: #9FD9F7; font-family: 'IBM Plex Mono', monospace">NEXT?</span>
</sc-if>
</button>
</sc-for>
</div>

<nav style="margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 68px; border-top: 1px solid #23262D; margin-left: -16px; margin-right: -16px; background: #16171B">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #9A9DA6">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="7" height="7" rx="1.5"></rect><rect x="11" y="2" width="7" height="7" rx="1.5"></rect><rect x="2" y="11" width="7" height="7" rx="1.5"></rect><rect x="11" y="11" width="7" height="7" rx="1.5"></rect></svg>Play</a>
<a href="Sound.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #9A9DA6">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 10 C4 2 6 2 8 10 S12 18 14 10 S17 4 19 10"></path></svg>Sound</a>
<a href="FX.dc.html" style="display: flex; align-items: center; justify-content: center"><span style="width: 54px; height: 42px; border-radius: 14px; background: #FF6B5E; color: #121316; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">FX</span></a>
<a href="Perform.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: {{accent}}">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="16" height="16" rx="2"></rect><circle cx="12" cy="8" r="2.5"></circle></svg>Perform</a>
<a href="Song.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #9A9DA6">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 5 h6 M10 5 h8 M2 10 h10 M14 10 h4 M2 15 h4 M8 15 h10"></path></svg>Song</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5CC8FF","#B8F07A","#FF8FB1"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { track: 4, chords: true, lit: 0, fx: -1 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#FFB547';
    const trackDefs = [
      ['KICK','drum'],['SNARE','drum'],['HATS','drum'],['BASS','FM'],
      ['KEYS','FM'],['PAD','FM'],['PERC','sample'],['VOX','sample']
    ];
    const tracks = trackDefs.map((d, i) => {
      const on = i === this.state.track;
      return {
        name: d[0], kind: d[1],
        pick: () => this.setState({ track: i }),
        style: 'flex-shrink: 0; min-width: 56px; height: 48px; padding: 0 9px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1px; cursor: pointer; ' +
          (on ? 'background: ' + accent + '; color: #121316; border: 1px solid ' + accent + ';' : 'background: #1E2026; color: #ECEDEF; border: 1px solid #2E313A;')
      };
    });
    const chordLabels = ['Cm','Fm','Gm','A♭','E♭','B♭','Cm7','Gsus','C','D','E♭','F','G','A♭','B♭','C↑'];
    const noteLabels = ['C','D','E♭','F','G','A♭','B♭','C↑','C','D','E♭','F','G','A♭','B♭','C↑'];
    const labels = this.state.chords ? chordLabels : noteLabels;
    const pads = labels.map((l, i) => {
      const on = i === this.state.lit;
      const next = this.state.chords && i === 1 && this.state.lit === 0;
      const isChordRow = this.state.chords && i < 8;
      const bg = on ? accent : (isChordRow ? '#262A33' : '#1E2026');
      const border = next ? '2px solid #5CC8FF' : '1px solid ' + (on ? accent : '#2E313A');
      return {
        label: l, next,
        hit: () => this.setState({ lit: i }),
        style: 'height: 62px; border-radius: 14px; background: ' + bg + '; border: ' + border + '; color: ' + (on ? '#121316' : '#ECEDEF') + '; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer;'
      };
    });
    const fxDefs = ['Stutter','Tape stop','Sweep','Throw'];
    const fx = fxDefs.map((l, i) => {
      const on = i === this.state.fx;
      return {
        label: l,
        hold: () => this.setState({ fx: on ? -1 : i }),
        style: 'height: 54px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; ' +
          (on ? 'background: #FF6B5E; color: #121316; border: 1px solid #FF6B5E;' : 'background: #1E2026; color: #ECEDEF; border: 1px solid #2E313A;')
      };
    });
    return {
      accent, tracks, pads, fx,
      toggleChords: () => this.setState({ chords: !this.state.chords }),
      chordBtnStyle: 'height: 40px; padding: 0 10px; border-radius: 10px; font-size: 12px; cursor: pointer; ' +
        (this.state.chords ? 'background: ' + accent + '; color: #121316; border: 1px solid ' + accent + ';' : 'background: #1E2026; color: #ECEDEF; border: 1px solid #2E313A;')
    };
  }
}
</script>
</body>
</html>
